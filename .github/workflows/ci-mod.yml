name: CI — Minecraft Fabric Mod

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/minecraft-mod/**'
      - '.github/workflows/ci-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/minecraft-mod/**'
      - '.github/workflows/ci-mod.yml'

jobs:
  build-mod:
    name: Build Fabric 1.20.1 Mod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: packages/minecraft-mod
        run: chmod +x gradlew

      - name: Build Fabric Mod Jar
        working-directory: packages/minecraft-mod
        run: ./gradlew build

      - name: Upload Fabric Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoslive-fabric-mod-1.20.1
          path: packages/minecraft-mod/build/libs/*.jar
