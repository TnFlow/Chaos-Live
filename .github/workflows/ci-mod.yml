name: CI — Minecraft Mod

on:
  push:
    branches: [main, develop]
    paths:
      - 'mc-mod/**'
  pull_request:
    branches: [main]
    paths:
      - 'mc-mod/**'

jobs:
  build-mod:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: mc-mod
        run: ./gradlew build

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaos-live-mod
          path: mc-mod/build/libs/*.jar
