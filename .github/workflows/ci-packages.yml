name: CI — TypeScript Packages

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'jest.config.js'
      - '.github/workflows/ci-packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'jest.config.js'
      - '.github/workflows/ci-packages.yml'

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/core/prisma/schema.prisma

      - name: TypeScript Build
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Verify Clean Working Tree
        run: git diff --exit-code
