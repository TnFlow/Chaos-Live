name: CI — TypeScript Packages

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'jest.config.js'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.base.json'

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
